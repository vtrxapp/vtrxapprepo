<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta name="theme-color" content="#0a0a0a"/>
    <meta name="description" content="VTRX — AI-Powered Fitness Platform"/>

    <!-- Preconnect to Google Fonts for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>

    <title>VTRX</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body, #root { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; }
      body { font-family: 'Montserrat', sans-serif; -webkit-font-smoothing: antialiased; }
      ::-webkit-scrollbar { display: none; }
      * { scrollbar-width: none; -ms-overflow-style: none; }
      @keyframes fadeUp  { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }
      @keyframes spin    { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
      @keyframes pulse   { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Vite injects your compiled React app here -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
